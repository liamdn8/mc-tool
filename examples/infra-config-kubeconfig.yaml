# DEPRECATED: This custom config format is no longer needed
# 
# Infrastructure Validation now uses standard kubeconfig format
# directly from ~/.kube/config or custom path via --config-dir flag
#
# Simply use kubectl to manage your contexts:
#   kubectl config get-contexts
#   kubectl config use-context <context-name>
#
# Then start mc-tool web:
#   mc-tool web --port 8080
#   mc-tool web --port 8080 --config-dir /path/to/custom/kubeconfig
#
# See docs/INFRAVALIDATION_KUBECONFIG.md for details

---
# Example standard kubeconfig format (use with kubectl config)
apiVersion: v1
kind: Config
clusters:
- name: site-a-prod-cluster
  cluster:
    server: https://api.site-a.example.com:6443
    certificate-authority-data: LS0tLS1CRUdJTi...  # Base64 encoded CA cert
    # OR use insecure-skip-tls-verify: true for testing

- name: site-b-staging-cluster
  cluster:
    server: https://api.site-b.example.com:6443
    certificate-authority-data: LS0tLS1CRUdJTi...

users:
- name: admin-user
  user:
    # Authentication method 1: Client certificate
    client-certificate-data: LS0tLS1CRUdJTi...
    client-key-data: LS0tLS1CRUdJTi...

- name: token-user
  user:
    # Authentication method 2: Bearer token
    token: eyJhbGciOiJSUzI1NiIsImtpZCI6Ik...

contexts:
- name: site-a-prod
  context:
    cluster: site-a-prod-cluster
    user: admin-user
    namespace: default  # Optional default namespace

- name: site-b-staging
  context:
    cluster: site-b-staging-cluster
    user: token-user
    namespace: default

current-context: site-a-prod

